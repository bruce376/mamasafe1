services:
  - type: web
    name: mamasafe-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DEV_MODE
        value: false
      - key: MONGODB_ALLOW_LOCAL_FALLBACK
        value: false
      - key: MONGODB_DB_NAME
        value: mamacare
      - key: CORS_ORIGINS
        value: https://mamasafe1.onrender.com,https://mamasafe-95d58.web.app,https://mamasafe-95d58.firebaseapp.com
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: MamaCare Admin
