<!DOCTYPE html>
<html>
<head>
    <title>Song Selection Fix Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h1>🎹 Song Selection Fix Test</h1>
        <p>Testing the fixed song selection functionality.</p>
        
        <!-- Test Controls -->
        <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <h3>Quick Test</h3>
            <button onclick="testSingleNote()">🎹 Test Single Piano Note</button>
            <button onclick="testSongSelection()">🎵 Test Song Selection</button>
            <button onclick="testAllSongs()">🎼 Test All Songs</button>
        </div>
        
        <!-- Status Display -->
        <div style="background: #ecfdf5; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <h3>Test Status</h3>
            <div id="testStatus">Ready to test...</div>
        </div>
        
        <!-- Sleep Songs Library -->
        <div class="ai-game">
            <div class="mini-game-head">
                <span class="mini-game-badge ai-badge">🎹 Piano Lullabies</span>
                <h4>Baby Sleep Songs (Fixed Version)</h4>
                <p>10 classic lullabies with piano-like tones, each lasting 1+ minute.</p>
            </div>
            
            <div class="sleep-songs-container">
                <div class="audio-player" id="audioPlayer">
                    <audio id="songAudio"></audio>
                    <div class="player-controls">
                        <button id="playPauseBtn" onclick="togglePlayPause()">▶️ Play</button>
                        <button onclick="stopAudio()">⏹️ Stop</button>
                        <div class="volume-control">
                            <span>🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="100" value="70" onchange="changeVolume(this.value)">
                        </div>
                    </div>
                    <div class="now-playing" id="nowPlaying">No song selected</div>
                </div>
                
                <div class="songs-list" id="songsList">
                    <!-- Songs will be populated by JavaScript -->
                </div>
            </div>
            
            <div class="mini-game-feedback" id="songsFeedback">Click on any song to test the fix</div>
        </div>
    </div>

    <script src="script-new.js"></script>
    <script>
        let testResults = [];
        
        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('testStatus');
            statusDiv.innerHTML = `<div style="color: ${isError ? 'red' : 'green'};">${message}</div>`;
            testResults.push({message, isError});
        }
        
        function testSingleNote() {
            updateStatus('🎹 Testing single piano note...');
            
            if ('AudioContext' in window || 'webkitAudioContext' in window) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    const audioContext = new AudioContextClass();
                    const gainNode = audioContext.createGain();
                    gainNode.connect(audioContext.destination);
                    gainNode.gain.value = 0.3;
                    
                    // Test piano note C4
                    playNote(audioContext, gainNode, 261.63, audioContext.currentTime, 1000);
                    
                    setTimeout(() => {
                        audioContext.close();
                        updateStatus('✅ Single piano note test successful!');
                    }, 1500);
                    
                } catch (error) {
                    updateStatus(`❌ Single note test failed: ${error.message}`, true);
                }
            } else {
                updateStatus('❌ Web Audio API not supported', true);
            }
        }
        
        function testSongSelection() {
            updateStatus('🎵 Testing song selection...');
            
            try {
                // Test Twinkle Twinkle Little Star
                const song = sleepSongs.find(s => s.id === 1);
                if (song) {
                    selectSong(1);
                    updateStatus('✅ Song selection test successful!');
                } else {
                    updateStatus('❌ Song not found', true);
                }
            } catch (error) {
                updateStatus(`❌ Song selection test failed: ${error.message}`, true);
            }
        }
        
        function testAllSongs() {
            updateStatus('🎼 Testing all songs...');
            let songIndex = 1;
            let passedTests = 0;
            let totalTests = 10;
            
            const playNextTest = () => {
                if (songIndex <= 10) {
                    try {
                        const song = sleepSongs.find(s => s.id === songIndex);
                        if (song) {
                            updateStatus(`🎵 Testing: ${song.title} (${songIndex}/10)`);
                            selectSong(songIndex);
                            passedTests++;
                            
                            // Stop after 3 seconds and move to next
                            setTimeout(() => {
                                stopAudio();
                                songIndex++;
                                setTimeout(playNextTest, 1000);
                            }, 3000);
                        }
                    } catch (error) {
                        updateStatus(`❌ Failed to play song ${songIndex}: ${error.message}`, true);
                        songIndex++;
                        setTimeout(playNextTest, 1000);
                    }
                } else {
                    updateStatus(`✅ All songs test complete: ${passedTests}/${totalTests} passed`);
                }
            };
            
            playNextTest();
        }
        
        // Initialize sleep songs immediately for testing
        document.addEventListener('DOMContentLoaded', () => {
            try {
                initializeSleepSongs();
                updateStatus('✅ Sleep songs initialized successfully');
            } catch (error) {
                updateStatus(`❌ Initialization failed: ${error.message}`, true);
            }
        });
        
        // Override error handler to catch issues
        window.addEventListener('error', (event) => {
            updateStatus(`❌ JavaScript Error: ${event.error.message}`, true);
            console.error('Test Error:', event.error);
        });
    </script>
</body>
</html>
